services:
  - type: web
    name: hoanglong-api
    runtime: node
    region: singapore
    plan: free
    branch: main
    rootDir: server
    buildCommand: npm ci
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: ADMIN_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://hoanglong-web.onrender.com

  - type: static
    name: hoanglong-web
    region: singapore
    plan: free
    branch: main
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://hoanglong-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
