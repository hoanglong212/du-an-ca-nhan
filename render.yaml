services:
  - type: web
    name: real-estate-api-hoanglong212
    runtime: node
    region: singapore
    plan: free
    branch: main
    rootDir: server
    buildCommand: npm ci
    startCommand: npm run db:bootstrap && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: true
      - key: DB_SSL_CA
        sync: false
      - key: ADMIN_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://real-estate-web-hoanglong212.onrender.com

  - type: web
    name: real-estate-web-hoanglong212
    runtime: static
    branch: main
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://real-estate-api-hoanglong212.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
